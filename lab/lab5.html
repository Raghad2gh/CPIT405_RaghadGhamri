<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - NBA Stats</title>
    <link rel="stylesheet" href="lab5.css">
</head>

<body>
    <header>
        <h1>NBA Player Stats Dashboard</h1>
        <button id="dark-mode-toggle">Toggle Dark Mode</button>
    </header>

    <search class="table-filters">
        <input type="text" id="search" placeholder="Search players...">
        <select id="team-filter">
            <option value="All">All</option>
        </select>
    </search>

    <table id="player-stats">
        <thead>
            <tr>
                <th>Name</th>
                <th>Team</th>
                <th>Points</th>
                <th>Rebounds</th>
                <th>Assists</th>
            </tr>
        </thead>
        <tbody id="player-rows"></tbody>
    </table>

    <script src="lab5.js"></script>
</body>

</html>
